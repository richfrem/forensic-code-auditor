rules:
  - id: ambient-header-identity-trust
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      User identity or tenant ID is extracted directly from an ambient proxy header ('x-forwarded-user', 'sm_user', 'x-user-id')
      without verifying cryptographic signature or gateway context on this specific request.
    metadata:
      classification: PERIMETER-BYPASS
      confidence: MEDIUM
    patterns:
      - pattern-either:
          - pattern: $REQ.headers['x-forwarded-user']
          - pattern: $REQ.headers['sm_user']
          - pattern: $REQ.headers['x-user-id']
          - pattern: $REQ.headers.get('x-forwarded-user')
          - pattern: $REQ.headers.get('sm_user')
          - pattern: $REQ.headers.get('x-user-id')
      - pattern-not-inside: |
          if (!verifySignature($REQ, ...)) { ... return ...; }
          ...
      - pattern-not-inside: |
          if (!verifyGatewayToken($REQ, ...)) { ... return ...; }
          ...
      - pattern-not-inside: |
          if (verifySignature($REQ, ...)) {
            ...
          }
      - pattern-not-inside: |
          if (verifyGatewayToken($REQ, ...)) {
            ...
          }
      - pattern-not-inside: |
          assertValidGateway($REQ, ...);
          ...
