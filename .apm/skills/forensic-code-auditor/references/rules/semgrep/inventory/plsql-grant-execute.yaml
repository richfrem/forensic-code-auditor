      "metadata": {
        "purpose": "inventory",
        "category": "db_grant"
      },
      "pattern-regex": "(?i)\\bGRANT(?:\\s|--[^\\n]*(?:\\n|$)|/\\*.*?\\*/)+EXECUTE(?:\\s|--[^\\n]*(?:\\n|$)|/\\*.*?\\*/)+ON(?:\\s|--[^\\n]*(?:\\n|$)|/\\*.*?\\*/)+[\\w.]+(?:\\s|--[^\\n]*(?:\\n|$)|/\\*.*?\\*/)+TO(?:\\s|--[^\\n]*(?:\\n|$)|/\\*.*?\\*/)+\\w+"
    }
  ]
}
