name: Forensic auditor checks
on:
  pull_request:
  push:
    branches: [main, 'feat/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: forensic-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SKILL: .apm/skills/forensic-code-auditor
      PYTHONDONTWRITEBYTECODE: '1'
      SEMGREP_SEND_METRICS: 'off'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.14'
      - name: Install pinned test tools
        run: python -m pip install -r "$SKILL/requirements-tests.txt"
      - name: Unit, validator probes, corpus, generator and documentation tests
        run: python -m unittest discover -s "$SKILL/tests" -v
      - name: Paired Semgrep rules
        run: semgrep --test "$SKILL/references/rules/semgrep"
      - name: Model reproduction and evidence validation
        run: |
          python "$SKILL/scripts/demo_authorization.py" --output "$RUNNER_TEMP/forensic-demo"
          python "$SKILL/scripts/validate_report.py" "$RUNNER_TEMP/forensic-demo/report.json" --evidence-root "$RUNNER_TEMP/forensic-demo"
      - name: Stage runtime and check evaluation contamination
        run: |
          python "$SKILL/scripts/stage_package.py" --output "$RUNNER_TEMP/forensic-runtime"
          python "$SKILL/tests/generate_blind_suite.py" --output "$RUNNER_TEMP/forensic-private" --dev-count 2 --sealed-count 2
          python "$SKILL/scripts/contamination_lint.py" --package-root "$RUNNER_TEMP/forensic-runtime" --sealed-keys "$RUNNER_TEMP/forensic-private/keys"
      - name: Download and verify pinned CodeQL
        run: |
          mkdir -p "$RUNNER_TEMP/codeql-tools"
          cd "$RUNNER_TEMP/codeql-tools"
          curl --fail --location --retry 2 --output codeql-linux64.zip https://github.com/github/codeql-cli-binaries/releases/download/v2.23.3/codeql-linux64.zip
          curl --fail --location --retry 2 --output codeql-linux64.zip.checksum.txt https://github.com/github/codeql-cli-binaries/releases/download/v2.23.3/codeql-linux64.zip.checksum.txt
          sha256sum --check codeql-linux64.zip.checksum.txt
          unzip -q codeql-linux64.zip
          echo "$RUNNER_TEMP/codeql-tools/codeql" >> "$GITHUB_PATH"
      - name: Pinned CodeQL qltests and extraction counts
        run: python "$SKILL/scripts/test_codeql.py"
